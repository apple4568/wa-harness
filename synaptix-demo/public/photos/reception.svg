<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration of a clinic reception desk and waiting area">
  <!-- Illustrative rendering created for the Synaptix demo. Not a photograph. -->
  <rect width="800" height="500" fill="#F1F3F7"/>
  <!-- floor -->
  <rect y="352" width="800" height="148" fill="#E1E5EC"/>
  <rect y="350" width="800" height="3" fill="#C4CAD6"/>
  <!-- soft window light on the left wall -->
  <rect x="40" y="60" width="150" height="230" rx="6" fill="#FFFFFF"/>
  <rect x="40" y="60" width="150" height="230" rx="6" fill="none" stroke="#C4CAD6" stroke-width="3"/>
  <line x1="115" y1="60" x2="115" y2="290" stroke="#C4CAD6" stroke-width="3"/>
  <line x1="40" y1="175" x2="190" y2="175" stroke="#C4CAD6" stroke-width="3"/>
  <polygon points="40,290 190,290 240,352 0,352" fill="#FFFFFF" opacity="0.45"/>
  <!-- accent wall panel behind the desk -->
  <rect x="270" y="70" width="330" height="200" rx="8" fill="#E1E5EC"/>
  <circle cx="435" cy="140" r="20" fill="#2436E0"/>
  <circle cx="452" cy="126" r="5" fill="#31E3B5"/>
  <rect x="380" y="180" width="110" height="10" rx="5" fill="#C4CAD6"/>
  <rect x="400" y="198" width="70" height="8" rx="4" fill="#C4CAD6"/>
  <!-- pendant lamps -->
  <line x1="330" y1="0" x2="330" y2="52" stroke="#3B4459" stroke-width="2"/>
  <line x1="540" y1="0" x2="540" y2="52" stroke="#3B4459" stroke-width="2"/>
  <path d="M310 52 h40 l-8 22 h-24 z" fill="#3B4459"/>
  <path d="M520 52 h40 l-8 22 h-24 z" fill="#3B4459"/>
  <!-- reception desk -->
  <rect x="270" y="286" width="330" height="90" rx="10" fill="#3B4459"/>
  <rect x="258" y="276" width="354" height="18" rx="6" fill="#FFFFFF" stroke="#C4CAD6" stroke-width="3"/>
  <rect x="290" y="312" width="290" height="4" rx="2" fill="#F1F3F7" opacity="0.35"/>
  <!-- small plant on the desk -->
  <rect x="540" y="252" width="26" height="24" rx="5" fill="#C4CAD6"/>
  <ellipse cx="553" cy="242" rx="18" ry="11" fill="#31E3B5"/>
  <ellipse cx="545" cy="232" rx="9" ry="12" fill="#31E3B5"/>
  <ellipse cx="561" cy="231" rx="9" ry="13" fill="#31E3B5"/>
  <!-- card holder / tablet on the desk -->
  <rect x="320" y="258" width="46" height="20" rx="3" fill="#C4CAD6"/>
  <!-- waiting chairs on the right -->
  <g fill="#C4CAD6">
    <rect x="640" y="276" width="60" height="16" rx="6"/>
    <rect x="640" y="296" width="60" height="44" rx="8"/>
    <rect x="712" y="276" width="60" height="16" rx="6"/>
    <rect x="712" y="296" width="60" height="44" rx="8"/>
  </g>
  <g fill="#3B4459">
    <rect x="650" y="228" width="40" height="52" rx="8"/>
    <rect x="722" y="228" width="40" height="52" rx="8"/>
    <rect x="644" y="340" width="4" height="14"/><rect x="692" y="340" width="4" height="14"/>
    <rect x="716" y="340" width="4" height="14"/><rect x="764" y="340" width="4" height="14"/>
  </g>
  <rect x="722" y="256" width="40" height="8" rx="4" fill="#2436E0"/>
  <!-- tall floor plant on the left -->
  <rect x="196" y="298" width="46" height="54" rx="8" fill="#C4CAD6"/>
  <ellipse cx="219" cy="270" rx="34" ry="24" fill="#31E3B5"/>
  <ellipse cx="200" cy="246" rx="16" ry="26" fill="#31E3B5"/>
  <ellipse cx="238" cy="244" rx="16" ry="28" fill="#31E3B5"/>
  <ellipse cx="219" cy="232" rx="12" ry="24" fill="#31E3B5"/>
  <!-- floor reflection -->
  <ellipse cx="435" cy="420" rx="260" ry="20" fill="#C4CAD6" opacity="0.5"/>
</svg>
