<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration of a consultation room with a desk, two chairs and a window">
  <!-- Illustrative rendering created for the Synaptix demo. Not a photograph. -->
  <rect width="800" height="500" fill="#F1F3F7"/>
  <rect y="356" width="800" height="144" fill="#E1E5EC"/>
  <rect y="354" width="800" height="3" fill="#C4CAD6"/>
  <!-- window with daylight -->
  <rect x="70" y="50" width="230" height="240" rx="6" fill="#FFFFFF"/>
  <rect x="70" y="50" width="230" height="240" rx="6" fill="none" stroke="#C4CAD6" stroke-width="3"/>
  <line x1="185" y1="50" x2="185" y2="290" stroke="#C4CAD6" stroke-width="3"/>
  <line x1="70" y1="170" x2="300" y2="170" stroke="#C4CAD6" stroke-width="3"/>
  <polygon points="70,290 300,290 380,356 0,356" fill="#FFFFFF" opacity="0.5"/>
  <!-- sheer curtain edge -->
  <rect x="300" y="40" width="26" height="260" rx="4" fill="#E1E5EC"/>
  <line x1="313" y1="40" x2="313" y2="300" stroke="#C4CAD6" stroke-width="2"/>
  <!-- wall shelf -->
  <rect x="600" y="110" width="150" height="8" rx="4" fill="#3B4459"/>
  <rect x="612" y="80" width="16" height="30" rx="2" fill="#C4CAD6"/>
  <rect x="632" y="72" width="14" height="38" rx="2" fill="#2436E0"/>
  <rect x="650" y="86" width="18" height="24" rx="2" fill="#C4CAD6"/>
  <rect x="704" y="92" width="24" height="18" rx="4" fill="#C4CAD6"/>
  <ellipse cx="716" cy="84" rx="14" ry="9" fill="#31E3B5"/>
  <!-- framed print -->
  <rect x="620" y="160" width="110" height="80" rx="4" fill="#FFFFFF" stroke="#C4CAD6" stroke-width="3"/>
  <circle cx="675" cy="200" r="18" fill="#E1E5EC"/>
  <circle cx="684" cy="192" r="5" fill="#2436E0"/>
  <!-- consultant chair (behind the desk) -->
  <rect x="470" y="200" width="70" height="80" rx="14" fill="#3B4459"/>
  <rect x="462" y="272" width="86" height="18" rx="8" fill="#3B4459"/>
  <rect x="500" y="290" width="8" height="40" fill="#3B4459"/>
  <path d="M470 332 h68" stroke="#3B4459" stroke-width="6" stroke-linecap="round"/>
  <!-- desk -->
  <rect x="330" y="282" width="340" height="16" rx="6" fill="#FFFFFF" stroke="#C4CAD6" stroke-width="3"/>
  <rect x="344" y="298" width="14" height="60" fill="#C4CAD6"/>
  <rect x="642" y="298" width="14" height="60" fill="#C4CAD6"/>
  <!-- monitor turned slightly toward the customer -->
  <rect x="540" y="218" width="88" height="58" rx="5" fill="#3B4459"/>
  <rect x="546" y="224" width="76" height="46" rx="3" fill="#E1E5EC"/>
  <rect x="556" y="234" width="40" height="6" rx="3" fill="#2436E0"/>
  <rect x="556" y="246" width="56" height="4" rx="2" fill="#C4CAD6"/>
  <rect x="556" y="254" width="48" height="4" rx="2" fill="#C4CAD6"/>
  <rect x="578" y="276" width="12" height="8" fill="#3B4459"/>
  <!-- notepad & pen -->
  <rect x="380" y="264" width="54" height="18" rx="2" fill="#E1E5EC" stroke="#C4CAD6" stroke-width="2"/>
  <rect x="446" y="270" width="36" height="4" rx="2" fill="#31E3B5"/>
  <!-- customer chair (front) -->
  <rect x="372" y="300" width="80" height="20" rx="8" fill="#C4CAD6"/>
  <rect x="380" y="318" width="64" height="40" rx="8" fill="#C4CAD6"/>
  <rect x="372" y="250" width="16" height="60" rx="6" fill="#C4CAD6"/>
  <rect x="384" y="356" width="4" height="14" fill="#3B4459"/>
  <rect x="436" y="356" width="4" height="14" fill="#3B4459"/>
  <!-- floor reflection -->
  <ellipse cx="500" cy="428" rx="250" ry="18" fill="#C4CAD6" opacity="0.5"/>
</svg>
