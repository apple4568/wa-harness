<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration of the clinic street entrance with a glass door, canopy and planters">
  <!-- Illustrative rendering created for the Synaptix demo. Not a photograph. -->
  <rect width="800" height="500" fill="#E1E5EC"/>
  <!-- pavement -->
  <rect y="390" width="800" height="110" fill="#F1F3F7"/>
  <rect y="388" width="800" height="3" fill="#C4CAD6"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#C4CAD6" stroke-width="2"/>
  <line x1="200" y1="390" x2="120" y2="500" stroke="#C4CAD6" stroke-width="2"/>
  <line x1="600" y1="390" x2="680" y2="500" stroke="#C4CAD6" stroke-width="2"/>
  <!-- facade cladding lines -->
  <g stroke="#C4CAD6" stroke-width="2" opacity="0.6">
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="220" x2="800" y2="220"/><line x1="0" y1="320" x2="800" y2="320"/>
  </g>
  <!-- side windows -->
  <rect x="60" y="150" width="130" height="180" rx="4" fill="#F1F3F7" stroke="#C4CAD6" stroke-width="3"/>
  <rect x="610" y="150" width="130" height="180" rx="4" fill="#F1F3F7" stroke="#C4CAD6" stroke-width="3"/>
  <!-- canopy -->
  <rect x="250" y="118" width="300" height="22" rx="4" fill="#3B4459"/>
  <path d="M250 140 h300 l16 18 h-332 z" fill="#C4CAD6"/>
  <!-- signboard -->
  <rect x="330" y="52" width="140" height="44" rx="8" fill="#FFFFFF" stroke="#C4CAD6" stroke-width="3"/>
  <circle cx="356" cy="74" r="12" fill="#2436E0"/>
  <circle cx="366" cy="65" r="4" fill="#31E3B5"/>
  <rect x="378" y="66" width="70" height="8" rx="4" fill="#3B4459"/>
  <rect x="378" y="80" width="46" height="5" rx="2.5" fill="#C4CAD6"/>
  <!-- door frame -->
  <rect x="292" y="158" width="216" height="232" fill="#3B4459"/>
  <!-- glass panels -->
  <rect x="302" y="168" width="98" height="222" fill="#F1F3F7" opacity="0.92"/>
  <rect x="404" y="168" width="94" height="222" fill="#F1F3F7" opacity="0.92"/>
  <polygon points="302,168 400,168 400,300 302,390" fill="#FFFFFF" opacity="0.45"/>
  <polygon points="404,168 498,168 498,240 404,340" fill="#FFFFFF" opacity="0.35"/>
  <!-- door handles -->
  <rect x="384" y="250" width="8" height="70" rx="4" fill="#2436E0"/>
  <rect x="410" y="250" width="8" height="70" rx="4" fill="#2436E0"/>
  <!-- opening-hours plaque -->
  <rect x="316" y="330" width="44" height="30" rx="3" fill="#FFFFFF" stroke="#C4CAD6" stroke-width="2"/>
  <rect x="322" y="338" width="30" height="3" fill="#C4CAD6"/><rect x="322" y="345" width="24" height="3" fill="#C4CAD6"/><rect x="322" y="352" width="28" height="3" fill="#C4CAD6"/>
  <!-- entry step -->
  <rect x="270" y="388" width="260" height="14" rx="3" fill="#C4CAD6"/>
  <!-- planters -->
  <rect x="204" y="330" width="66" height="60" rx="6" fill="#3B4459"/>
  <rect x="530" y="330" width="66" height="60" rx="6" fill="#3B4459"/>
  <g fill="#31E3B5">
    <ellipse cx="237" cy="310" rx="34" ry="24"/><ellipse cx="220" cy="286" rx="14" ry="26"/><ellipse cx="254" cy="284" rx="14" ry="28"/>
    <ellipse cx="563" cy="310" rx="34" ry="24"/><ellipse cx="546" cy="286" rx="14" ry="26"/><ellipse cx="580" cy="284" rx="14" ry="28"/>
  </g>
  <!-- wall lamp -->
  <rect x="560" y="80" width="18" height="8" rx="4" fill="#3B4459"/>
  <ellipse cx="569" cy="104" rx="30" ry="14" fill="#FFFFFF" opacity="0.6"/>
</svg>
