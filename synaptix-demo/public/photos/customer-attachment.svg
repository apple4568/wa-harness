<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Placeholder for a customer attachment (blurred, no content shown)">
  <!-- Neutral placeholder created for the Synaptix demo. Represents a customer-sent image; never used as clinic knowledge. -->
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="frame"><rect width="800" height="500" rx="12"/></clipPath>
  </defs>
  <rect width="800" height="500" rx="12" fill="#E1E5EC"/>
  <g clip-path="url(#frame)" filter="url(#soft)">
    <ellipse cx="220" cy="180" rx="240" ry="150" fill="#C4CAD6"/>
    <ellipse cx="600" cy="140" rx="200" ry="120" fill="#F1F3F7"/>
    <ellipse cx="420" cy="380" rx="300" ry="140" fill="#C4CAD6" opacity="0.8"/>
    <ellipse cx="690" cy="400" rx="160" ry="110" fill="#3B4459" opacity="0.28"/>
    <ellipse cx="120" cy="430" rx="150" ry="90" fill="#3B4459" opacity="0.2"/>
  </g>
  <!-- label pill -->
  <rect x="250" y="222" width="300" height="56" rx="28" fill="#3B4459" opacity="0.92"/>
  <!-- paperclip glyph -->
  <path d="M292 262 l24 -24 a9 9 0 0 1 13 13 l-26 26 a15 15 0 0 1 -21 -21 l28 -28" fill="none" stroke="#31E3B5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="332" y="257" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="500" fill="#F1F3F7">Customer attachment</text>
  <!-- frame edge -->
  <rect x="1.5" y="1.5" width="797" height="497" rx="12" fill="none" stroke="#C4CAD6" stroke-width="3"/>
</svg>
