<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration of a lounge with a sofa, low table and tall window">
  <!-- Illustrative rendering created for the Synaptix demo. Not a photograph. Previous lounge layout (withdrawn item). -->
  <rect width="800" height="500" fill="#F1F3F7"/>
  <rect y="356" width="800" height="144" fill="#E1E5EC"/>
  <rect y="354" width="800" height="3" fill="#C4CAD6"/>
  <!-- tall window with blinds -->
  <rect x="80" y="40" width="270" height="280" rx="6" fill="#FFFFFF"/>
  <rect x="80" y="40" width="270" height="280" rx="6" fill="none" stroke="#C4CAD6" stroke-width="3"/>
  <g stroke="#E1E5EC" stroke-width="6">
    <line x1="86" y1="70" x2="344" y2="70"/><line x1="86" y1="100" x2="344" y2="100"/><line x1="86" y1="130" x2="344" y2="130"/>
    <line x1="86" y1="160" x2="344" y2="160"/><line x1="86" y1="190" x2="344" y2="190"/><line x1="86" y1="220" x2="344" y2="220"/>
    <line x1="86" y1="250" x2="344" y2="250"/><line x1="86" y1="280" x2="344" y2="280"/>
  </g>
  <line x1="215" y1="40" x2="215" y2="320" stroke="#C4CAD6" stroke-width="3"/>
  <polygon points="80,320 350,320 420,356 20,356" fill="#FFFFFF" opacity="0.45"/>
  <!-- rug -->
  <ellipse cx="560" cy="420" rx="230" ry="34" fill="#C4CAD6" opacity="0.6"/>
  <!-- sofa -->
  <rect x="400" y="196" width="320" height="60" rx="14" fill="#3B4459"/>
  <rect x="386" y="240" width="348" height="64" rx="16" fill="#3B4459"/>
  <rect x="404" y="250" width="96" height="40" rx="8" fill="#C4CAD6"/>
  <rect x="512" y="250" width="96" height="40" rx="8" fill="#C4CAD6"/>
  <rect x="620" y="250" width="96" height="40" rx="8" fill="#C4CAD6"/>
  <rect x="426" y="210" width="50" height="34" rx="7" fill="#2436E0"/>
  <rect x="404" y="302" width="6" height="30" fill="#3B4459"/>
  <rect x="712" y="302" width="6" height="30" fill="#3B4459"/>
  <!-- coffee table -->
  <rect x="440" y="326" width="200" height="12" rx="6" fill="#FFFFFF" stroke="#C4CAD6" stroke-width="3"/>
  <rect x="456" y="338" width="6" height="30" fill="#C4CAD6"/>
  <rect x="618" y="338" width="6" height="30" fill="#C4CAD6"/>
  <rect x="500" y="308" width="30" height="18" rx="3" fill="#E1E5EC" stroke="#C4CAD6" stroke-width="2"/>
  <ellipse cx="580" cy="322" rx="12" ry="5" fill="#31E3B5"/>
  <!-- plant beside the window -->
  <rect x="356" y="296" width="44" height="58" rx="8" fill="#C4CAD6"/>
  <ellipse cx="378" cy="266" rx="30" ry="22" fill="#31E3B5"/>
  <ellipse cx="362" cy="242" rx="14" ry="26" fill="#31E3B5"/>
  <ellipse cx="394" cy="240" rx="14" ry="28" fill="#31E3B5"/>
  <!-- floor lamp -->
  <rect x="742" y="200" width="4" height="150" fill="#3B4459"/>
  <path d="M718 200 h52 l-8 -46 h-36 z" fill="#E1E5EC" stroke="#C4CAD6" stroke-width="3"/>
  <ellipse cx="744" cy="352" rx="18" ry="5" fill="#3B4459"/>
  <!-- small wall art -->
  <rect x="470" y="80" width="150" height="70" rx="4" fill="#FFFFFF" stroke="#C4CAD6" stroke-width="3"/>
  <rect x="486" y="96" width="60" height="38" rx="2" fill="#E1E5EC"/>
  <circle cx="586" cy="115" r="12" fill="#2436E0"/>
</svg>
