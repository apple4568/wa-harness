<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration of the recovery lounge with two recliners, a side table and a wide window">
  <!-- Illustrative rendering created for the Synaptix demo. Not a photograph. -->
  <rect width="800" height="500" fill="#F1F3F7"/>
  <rect y="360" width="800" height="140" fill="#E1E5EC"/>
  <rect y="358" width="800" height="3" fill="#C4CAD6"/>
  <!-- wide window strip -->
  <rect x="90" y="46" width="620" height="140" rx="6" fill="#FFFFFF"/>
  <rect x="90" y="46" width="620" height="140" rx="6" fill="none" stroke="#C4CAD6" stroke-width="3"/>
  <line x1="297" y1="46" x2="297" y2="186" stroke="#C4CAD6" stroke-width="3"/>
  <line x1="503" y1="46" x2="503" y2="186" stroke="#C4CAD6" stroke-width="3"/>
  <ellipse cx="400" cy="250" rx="360" ry="60" fill="#FFFFFF" opacity="0.4"/>
  <!-- hanging plant -->
  <line x1="740" y1="0" x2="740" y2="60" stroke="#3B4459" stroke-width="2"/>
  <rect x="716" y="60" width="48" height="26" rx="6" fill="#C4CAD6"/>
  <ellipse cx="740" cy="56" rx="30" ry="12" fill="#31E3B5"/>
  <path d="M722 84 q-10 40 6 70" stroke="#31E3B5" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M756 84 q12 36 -2 64" stroke="#31E3B5" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- recliner A -->
  <g>
    <path d="M120 226 q4 -20 24 -20 h88 v76 h-112 z" fill="#3B4459"/>
    <rect x="112" y="280" width="220" height="42" rx="18" fill="#3B4459"/>
    <rect x="112" y="318" width="220" height="16" rx="8" fill="#C4CAD6"/>
    <rect x="132" y="222" width="90" height="12" rx="6" fill="#C4CAD6"/>
    <rect x="172" y="290" width="130" height="22" rx="8" fill="#E1E5EC"/>
    <rect x="172" y="300" width="130" height="4" fill="#31E3B5"/>
    <rect x="130" y="334" width="6" height="26" fill="#3B4459"/>
    <rect x="308" y="334" width="6" height="26" fill="#3B4459"/>
  </g>
  <!-- recliner B -->
  <g>
    <path d="M470 226 q4 -20 24 -20 h88 v76 h-112 z" fill="#3B4459"/>
    <rect x="462" y="280" width="220" height="42" rx="18" fill="#3B4459"/>
    <rect x="462" y="318" width="220" height="16" rx="8" fill="#C4CAD6"/>
    <rect x="482" y="222" width="90" height="12" rx="6" fill="#C4CAD6"/>
    <rect x="522" y="290" width="130" height="22" rx="8" fill="#E1E5EC"/>
    <rect x="522" y="300" width="130" height="4" fill="#2436E0"/>
    <rect x="480" y="334" width="6" height="26" fill="#3B4459"/>
    <rect x="658" y="334" width="6" height="26" fill="#3B4459"/>
  </g>
  <!-- side table between the recliners -->
  <rect x="362" y="290" width="76" height="10" rx="5" fill="#FFFFFF" stroke="#C4CAD6" stroke-width="3"/>
  <rect x="396" y="300" width="6" height="58" fill="#C4CAD6"/>
  <ellipse cx="399" cy="358" rx="22" ry="5" fill="#C4CAD6"/>
  <rect x="372" y="272" width="18" height="18" rx="3" fill="#E1E5EC" stroke="#C4CAD6" stroke-width="2"/>
  <rect x="404" y="274" width="18" height="16" rx="3" fill="#E1E5EC" stroke="#C4CAD6" stroke-width="2"/>
  <!-- low light on the wall -->
  <rect x="30" y="120" width="30" height="70" rx="6" fill="#FFFFFF" stroke="#C4CAD6" stroke-width="3"/>
  <rect x="38" y="130" width="14" height="50" rx="4" fill="#E1E5EC"/>
  <!-- floor reflection -->
  <ellipse cx="400" cy="430" rx="280" ry="18" fill="#C4CAD6" opacity="0.5"/>
</svg>
